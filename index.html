<script>
/* Reads content.txt and lays it out for the collage script below. You don't need to edit this file. */
(function () {
  var IMG = /\.(jpe?g|png|gif|webp|avif)$/i;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  fetch('content.txt', { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (txt) {
    var text = [], work = '';
    txt.replace(/\r/g, '').split('\n').forEach(function (raw) {
      var line = raw.trim();
      if (!line || line.charAt(0) === '#') return;
      var ga = line.match(/^analytics:\s*([a-z0-9-]+)\s*$/i);
      if (ga) {
        var gs = document.createElement('script'); gs.async = true; gs.src = 'https://gc.zgo.at/count.js';
        gs.setAttribute('data-goatcounter', 'https://' + ga[1].toLowerCase() + '.goatcounter.com/count');
        document.head.appendChild(gs); return;
      }
      if (/^note\s*\|/i.test(line)) { work += '<div class="note">' + esc(line) + '</div>'; return; }

      /* Tile | Big text | Small text | Label | Colour  ->  a coloured text tile that only floats in the collage */
      if (/^(tile|stat)\s*\|/i.test(line)) {
        var st = line.split('|').map(function (x) { return x.trim(); });
        if (st[1]) (window.DRIFT_STATS = window.DRIFT_STATS || []).push({ big: st[1], small: st[2] || '', group: st[3] || '', color: st[4] || '' });
        return;
      }
      if (/^software\s*\|/i.test(line)) {
        var sp = line.split('|').map(function (x) { return x.trim(); });
        if (sp[1]) (window.DRIFT_SOFTWARE = window.DRIFT_SOFTWARE || []).push({ name: sp[1], icon: sp[2] || '', year: sp[3] || '' });
        return;
      }
      var bar = line.indexOf('|'), file = bar > 0 ? line.slice(0, bar).trim() : '';
      if (file && IMG.test(file)) {
        var src = file.indexOf('/') >= 0 ? file : 'images/' + file;
        work += '<figure><img src="' + esc(encodeURI(src)) + '" alt=""><figcaption class="caption">' + esc(line.slice(bar + 1).trim()) + '</figcaption></figure>';
        return;
      }
      text.push(esc(line));
    });
    document.getElementById('content').innerHTML = '<div class="sitetext">' + text.join('<br>') + '</div>' + work;
  });
})();
</script>

  }

</script>

<script>
/* spinning tab icon: redraws the @-style "A" at a fixed speed (one full turn every 6 seconds) */
(function () {
  var PERIOD = 6000;
  var cv = document.createElement('canvas'); if (!cv.getContext) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cv.width = cv.height = 64; var ctx = cv.getContext('2d');
  var dark = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : { matches: false };
  function src(c) {
    return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><g fill="none" stroke="' + c +
      '" stroke-width="6.5"><path d="M22 45 L32 20.5 L42 45 C44.5 50.5 53 50.5 57 42 A27 27 0 1 0 43 56.6"/><path d="M25.5 37 H38.5"/></g></svg>');
  }
  var light = new Image(), night = new Image(); light.src = src('#0a0a0a'); night.src = src('#ffffff');
  var link = null, STEPS = 150, cache = { light: [], night: [] };
  /* each angle is drawn once and remembered, so the page never re-encodes the icon while the collage moves */
  function tick() {
    var key = dark.matches ? 'night' : 'light', img = key === 'night' ? night : light; if (!img.complete || !img.naturalWidth) return;
    if (!link) {
      document.querySelectorAll('link[rel="icon"]').forEach(function (l) { l.remove(); });
      link = document.createElement('link'); link.rel = 'icon'; link.type = 'image/png'; document.head.appendChild(link);
    }
    var i = Math.floor((Date.now() % PERIOD) / PERIOD * STEPS), url = cache[key][i];
    if (!url) {
      ctx.clearRect(0, 0, 64, 64); ctx.save(); ctx.translate(32, 32); ctx.rotate(i / STEPS * Math.PI * 2); ctx.drawImage(img, -32, -32, 64, 64); ctx.restore();
      url = cache[key][i] = cv.toDataURL('image/png');
    }
    if (link.href !== url) link.href = url;
  }
  /* 25 updates a second: as fast as Chrome actually repaints a tab icon, without stealing time from the page */
  setInterval(tick, 40);
})();
</script>
